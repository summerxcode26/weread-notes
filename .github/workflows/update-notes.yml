name: Update WeRead Notes

on:
  schedule:
    # 17 min past the hour, not on the hour — GitHub's scheduler is most
    # congested (and most likely to drop runs) right at :00. Scheduled 2h
    # earlier than the actual target time to absorb GitHub's typical 2-5h
    # scheduling delay for low-activity repos, so it still lands by morning.
    - cron: '17 22 * * *'  # ~22:17 UTC = ~06:17 Beijing time (target: 08:17)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest notes
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: |
          # Runner-side network hiccups happen occasionally (see the 2026-07-07
          # run, which failed with "Network is unreachable"); retry a few times
          # with backoff before giving up, so one flaky run doesn't skip a day.
          for i in 1 2 3; do
            if python3 fetch_data.py; then exit 0; fi
            echo "fetch_data.py failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No new notes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "自动同步笔记数据 $(date -u +%Y-%m-%d)"
          git push
