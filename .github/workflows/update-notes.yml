name: Update WeRead Notes

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC = 08:00 Beijing time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest notes
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python3 fetch_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No new notes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "自动同步笔记数据 $(date -u +%Y-%m-%d)"
          git push
